
name: CI

on: [push, pull_request]

jobs:
  tp1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install pandas scikit-learn pytest "fastapi==0.115.*" "httpx==0.27.*" "uvicorn==0.30.*" "streamlit==1.39.*"

      - name: Préparer le modèle
        run: |
          . .venv/bin/activate
          python src/make_demo.py
          python src/train.py

      - name: Exécuter les tests
        run: |
          . .venv/bin/activate
          pytest -q

  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les outils de qualité
        run: |
          python -m pip install ruff mypy pre-commit "fastapi==0.115.*"

      - name: Vérifier le style avec Ruff
        run: ruff check .

      - name: Vérifier les types avec MyPy
        run: mypy api

      - name: Vérifier la configuration pre-commit
        run: pre-commit validate-config

      - name: Exécuter les hooks pre-commit
        run: pre-commit run --all-files
